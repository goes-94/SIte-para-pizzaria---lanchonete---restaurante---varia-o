<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Pedidos | PIZZAS & SABORES</title>
  <link rel="stylesheet" href="./cards.css" />
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f9f9f9;
      margin: 0;
      margin-top: 3em;
      padding: 20px;
    }
    header {
  /* background: linear-gradient(90deg, #f5e3c3, #d2a679); */
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

h1{
    display: flex;
    justify-content: center;
    align-items: center;
}

header h2 {
  font-family: 'League Gothic', sans-serif;
  font-size: 3.5rem;
  color: #b22222;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin: 0;
}

header nav ul.menu {
  display: flex;
  gap: 30px;
  list-style: none;
  margin: 0;
  padding: 0;
}

header nav ul.menu li a {
  text-decoration: none;
  color: #b22222;
  font-weight: 600;
  transition: color 0.3s ease;
}

header nav ul.menu li a:hover {
  color: #ffd75e;
}

    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #007BFF;
      color: #fff;
    }
    select {
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-weight: bold;
    }

   /* --- RESPONSIVIDADE --- */
@media (max-width: 768px) {
        body {
            display: block;
            align-items: center;
      font-family: 'Poppins', sans-serif;
      background: #f9f9f9;
      margin: 0;
      margin-top: 3em;
      padding: 0px;
    }
  header {
    flex-direction: column;
    text-align: center;
    align-items: center;
    justify-content: center;
    margin: 0 0px;
    gap: 0;
    padding: 0;
  }

  header h2 {
    font-size: 2rem;
    margin-bottom: 10px;
  }

  header nav ul.menu {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 0 0px;
  }
  h1{
    display: flex;
    justify-content: center;
    align-items: center;
}
}
  </style>
</head>
<body>
  <header>
    <h2>PIZZAS & SABORES</h2>
    <nav>
      <ul class="menu">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./dashboard.html">Onboard</a></li>
        <li><a href="./carrinho.html">Carrinho</a></li>
      </ul>
    </nav>
  </header>

  <h1>Painel de Pedidos</h1>
  <table id="tabelaPedidos">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Número</th>
        <th>Pedido</th>
        <th>Endereço</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <!-- tbody com id correto -->
    <tbody id="lista-pedidos"></tbody>
  </table>

  <!-- Verificação de login -->
  <script>
    if (localStorage.getItem("logado") !== "true") {
      alert("Acesso restrito! Faça login primeiro.");
      window.location.href = "login.html";
    }
  </script>

  <!-- Scripts principais -->
  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
