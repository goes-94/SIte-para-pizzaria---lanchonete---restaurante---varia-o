<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de Login - Detalhes do Produto | Pizzas & Sabores</title>
  <link rel="stylesheet" href="./bebidas.css" />
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<header>
  <h2 class="title1">Pizzas & Sabores</h2>
  <nav>
    <ul class="menu">
      <li><a href="./index.html">Home</a></li>
      <li><a href="./bebidas.html">Bebidas</a></li>
      <li><a href="./carrinho.html">Carrinho</a></li>
      <li><a href="./faleconosco.html">Fale Conosco</a></li>
    </ul>
  </nav>
</header>
  <style>
body {
  font-family: Arial, sans-serif;
  background: #f9f9f9;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;   /* organiza em coluna */
  align-items: center;      /* centraliza horizontalmente */
  min-height: 100vh;        /* ocupa toda a altura da tela */
}

/* --- HEADER --- */
header {
  width: 100%;              /* garante que o header ocupe toda a tela */
  padding: 20px 40px;
  display: flex;
  justify-content: space-between; /* título à esquerda, menu à direita */
  align-items: center;
}
header h2 {
  font-family: 'League Gothic', sans-serif;
  font-size: 3.5rem;
  color: #b22222;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin: 0; /* remove margens fixas */
}

header nav ul.menu {
  display: flex;
  gap: 30px;
  list-style: none;
  margin: 0;
  padding: 0;
}

header nav ul.menu li a {
  text-decoration: none;
  color: #b22222;
  font-weight: 600;
  transition: color 0.3s ease;
}

header nav ul.menu li a:hover {
  color: #ffd75e;
}

/* --- RESPONSIVIDADE --- */
@media (max-width: 768px) {
  header {
    flex-direction: column;       /* empilha os elementos */
    align-items: center;          /* centraliza horizontalmente */
    text-align: center;
  }

  header h2 {
    font-size: 2rem;
    margin-bottom: 15px;          /* espaço entre título e menu */
  }

  header nav ul.menu {
    flex-direction: row;       /* menu em coluna */
    gap: 30px;                    /* espaçamento entre links */
    margin: 10px;
    padding: 0;
  }

  header nav ul.menu li a {
    display: block;               /* cada link ocupa linha inteira */
    text-align: center;
  }

}
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      width: 300px;
      margin-top: 7%;
      text-align: center;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      margin: 0 -80% ;
      color: #800020;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #218838;
    }
    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    /* --- RESPONSIVIDADE --- */
@media (max-width: 768px) {
  header {
    flex-direction: column;
    text-align: center;
  }

  header h2 {
    font-size: 2rem;
    margin-bottom: 10px;
  }

  header nav ul.menu {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
  }
}
</style>
<body>
  <div class="login-box">
    <h2>Login do Painel</h2>
    <form id="loginForm">
      <input type="text" id="usuario" placeholder="Usuário" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <p id="erro" class="error"></p>
    </form>
  </div>

  <script src="./script.js" >
   
  </script>
</body>
</html>
